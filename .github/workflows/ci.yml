name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: hiero-journal-rs

      - name: Checkout hiero-streams-rs
        uses: actions/checkout@v4
        with:
          repository: hiero-hackers/hiero-streams-rs
          path: hiero-streams-rs

      - name: Create Cargo workspace manifest
        run: |
          echo '[workspace]' > Cargo.toml
          echo 'members = ["hiero-journal-rs","hiero-streams-rs"]' >> Cargo.toml

      # hiero-journal builds hiero-streams transitively, whose build.rs
      # compiles protobufs — so protoc is required even though this crate
      # has no .proto of its own.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: cargo fmt --all --check

      # Default features (block-proof verification on) and the lean
      # record-only configuration — feature-gated code must not rot unseen.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings

      - run: cargo test
      - run: cargo test --no-default-features

      # Doctest is off, so this is the only check the doc comments get —
      # it fails on a broken intra-doc link.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: hiero-journal-rs

      - name: Checkout hiero-streams-rs
        uses: actions/checkout@v4
        with:
          repository: hiero-hackers/hiero-streams-rs
          path: hiero-streams-rs

      - name: Create Cargo workspace manifest
        run: |
          echo '[workspace]' > Cargo.toml
          echo 'members = ["hiero-journal-rs","hiero-streams-rs"]' >> Cargo.toml

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.82"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - run: cargo check --workspace --all-features
